# Selbst-Hosting eines FamilyHome-Servers (eine Familie pro Server), docs/SICHERHEIT.md Kap. 3 und 5.2.
# Das Server-Image kommt signiert aus GHCR; deploy/update.sh prüft die cosign-Signatur, bevor es ausgerollt wird.
# Start:  cp .env.example .env  &&  (Werte setzen)  &&  ./update.sh
name: familyhome

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]

services:
  # Einziger öffentlicher Eintrittspunkt: TLS 1.3 + Prüfung der Gerätezertifikate (mTLS)
  caddy:
    <<: *hardening
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "443:443"
      - "80:80"        # nur für die ACME-HTTP-Challenge und die Weiterleitung auf HTTPS
    environment:
      FAMILYHOME_DOMAIN: "${FAMILYHOME_DOMAIN:?FAMILYHOME_DOMAIN fehlt}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL fehlt}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ca-export:/ca:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy:
        ipv4_address: 172.30.10.2
    depends_on:
      server:
        condition: service_healthy

  server:
    <<: *hardening
    # Wird von update.sh auf den verifizierten Digest gesetzt (FAMILYHOME_IMAGE in .env)
    image: ${FAMILYHOME_IMAGE:?FAMILYHOME_IMAGE fehlt - update.sh ausführen}
    environment:
      ConnectionStrings__FamilyHome: "Host=db;Port=5432;Database=familyhome;Username=familyhome_app;Password=${POSTGRES_APP_PASSWORD}"
      # Nur Caddy darf den Zertifikat-Header setzen
      Security__TrustedProxyNetworks__0: "172.30.10.2/32"
      Security__CaExportPath: /ca/family-ca.crt
    volumes:
      # Data-Protection-Schlüssel (verschlüsseln CA-Schlüssel und DAV-Passwörter) müssen Neustarts überleben
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
      - ca-export:/ca
    networks: [proxy, backend]
    # Kein eigener Port: nur über Caddy erreichbar.
    healthcheck:
      test: ["CMD", "dotnet", "FamilyHome.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /run/postgresql]
    environment:
      POSTGRES_DB: familyhome
      POSTGRES_USER: familyhome_owner
      POSTGRES_PASSWORD: "${POSTGRES_OWNER_PASSWORD}"
      # TODO Phase 0: Init-Skript legt familyhome_app (nur DML) und familyhome_migrator an
    volumes:
      # PostgreSQL 18+: Volume auf /var/lib/postgresql (Daten in <major>/docker, erleichtert pg_upgrade)
      - pg-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhome_owner -d familyhome"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  # Datenbank-Netz ohne Internetzugang
  backend:
    internal: true

volumes:
  pg-data:
  dataprotection:
  ca-export:
  caddy-data:
  caddy-config:
