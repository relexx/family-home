name: familyhome-dev

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/FamilyHome:cached
      - nuget-cache:/home/vscode/.nuget
      - claude-config:/home/vscode/.claude
    environment:
      ConnectionStrings__FamilyHome: "Host=db;Port=5432;Database=familyhome;Username=familyhome;Password=familyhome"
      ASPNETCORE_ENVIRONMENT: Development
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    extra_hosts:
      # Erreichbarkeit des Host-ADB-Servers (siehe README, Abschnitt "Auf dem Handy testen")
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - radicale

  db:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyhome
      POSTGRES_USER: familyhome
      POSTGRES_PASSWORD: familyhome
    volumes:
      # PostgreSQL 18+: Volume auf /var/lib/postgresql (Daten in <major>/docker, erleichtert pg_upgrade)
      - pg-data:/var/lib/postgresql

  # CalDAV/CardDAV-Testserver für die DAV-Sync-Entwicklung (http://radicale:5232, Login beliebig)
  radicale:
    image: tomsquest/docker-radicale:3.8.3.0@sha256:a3b1b452f4bc3d1aee43015b85bc2d9ee5de0ff7e96d5d2b47f1d889aa682409
    restart: unless-stopped
    volumes:
      - radicale-data:/data

volumes:
  nuget-cache:
  claude-config:
  pg-data:
  radicale-data:
