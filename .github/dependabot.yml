version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      efcore-aspnet:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.AspNetCore*", "Microsoft.Extensions*", "Npgsql*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing*"]
      android:
        patterns: ["Xamarin.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/src/FamilyHome.Server", "/.devcontainer"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ["/deploy", "/.devcontainer"]
    schedule:
      interval: weekly
    ignore:
      # Architektur-Tags "386.x.y.z" sind keine Versionen
      - dependency-name: tomsquest/docker-radicale
        versions: [">= 100"]
      # PostgreSQL-Major-Updates nur bewusst mit Upgrade-Skript (docs/SICHERHEIT.md 5.2)
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
