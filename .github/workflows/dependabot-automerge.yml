name: Dependabot Auto-Merge (Patch)

# Patch-Updates von Abhängigkeiten werden nach grünen Pflicht-Checks automatisch gemergt.
# Minor/Major brauchen eine manuelle Freigabe (docs/SICHERHEIT.md Kap. 5.2).
on:
  pull_request:

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
