name: DevContainer

# Baut das DevContainer-Image bei Änderungen (und wöchentlich), damit die Entwicklungsumgebung nicht unbemerkt bricht.
on:
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  push:
    branches: [main]
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: DevContainer-Image bauen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: familyhome-devcontainer:ci

      - name: Werkzeuge im Image prüfen
        run: |
          docker run --rm familyhome-devcontainer:ci bash -lc '
            set -e
            dotnet --version
            dotnet workload list | grep -q android
            java -version 2>&1 | head -1
            sdkmanager --list_installed | grep -E "platforms;|build-tools;|platform-tools"
            pipx --version
            gitleaks version
            hadolint --version
            actionlint --version
            shellcheck --version
            semgrep --version
            zizmor --version
            iptables --version
            ipset --version
            test -x /usr/local/bin/init-firewall.sh
            test "$(stat -c %U /usr/local/bin/init-firewall.sh)" = root
            if command -v docker; then echo "docker must not be in the image"; exit 1; fi
            if sudo -n true 2>/dev/null; then echo "the user must not have sudo"; exit 1; fi'

      # Processes started as root (entrypoint, firewall) must not find commands in user-writable directories
      - name: Root-PATH nicht vom Benutzer beschreibbar
        run: |
          root_path=$(grep -oE '^ +PATH: [^ ]+' .devcontainer/docker-compose.yml | awk '{print $2}')
          test -n "$root_path"
          docker run --rm -e "ROOT_PATH=$root_path" familyhome-devcontainer:ci bash -c '
            IFS=:
            for d in $ROOT_PATH; do
              [ -e "$d" ] || continue
              if [ -w "$d" ]; then echo "user-writable directory in the root PATH: $d"; exit 1; fi
            done
            echo "root PATH ok: $ROOT_PATH"'

      # Dependabot updates the FROM lines in the Dockerfile, but not the docker run lines in security-lint.yml
      - name: Scanner-Versionen wie in security-lint.yml
        run: |
          set -e
          for image in zricethezav/gitleaks hadolint/hadolint rhysd/actionlint koalaman/shellcheck; do
            dev=$(grep -oE "FROM ${image}:[^@ ]+" .devcontainer/Dockerfile | cut -d: -f2)
            ci=$(grep -oE "${image}:[^ ]+" .github/workflows/security-lint.yml | sort -u | cut -d: -f2)
            echo "$image: devcontainer=$dev ci=$ci"
            test -n "$dev" && test "$dev" = "$ci"
          done
          dev=$(grep -oE 'SEMGREP_VERSION=[^ ]+' .devcontainer/Dockerfile | cut -d= -f2)
          ci=$(grep -oE 'semgrep/semgrep:[^ ]+' .github/workflows/security-lint.yml | cut -d: -f2)
          echo "semgrep: devcontainer=$dev ci=$ci"; test -n "$dev" && test "$dev" = "$ci"
          dev=$(grep -oE 'ZIZMOR_VERSION=[^ ]+' .devcontainer/Dockerfile | cut -d= -f2)
          ci=$(grep -oE 'zizmor==[^ ]+' .github/workflows/security-lint.yml | cut -d= -f3)
          echo "zizmor: devcontainer=$dev ci=$ci"; test -n "$dev" && test "$dev" = "$ci"
