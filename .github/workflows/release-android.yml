name: Android-Release

# Signierte Release-APK + Ed25519-signiertes Update-Manifest (docs/SICHERHEIT.md Kap. 5.1).
# Secrets liegen ausschließlich im Environment "release" (mit Pflicht-Freigabe, nur Tags v*).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write          # GitHub Release anlegen
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Android-Workload
        run: dotnet workload install android

      - name: Versionsnummern aus dem Tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH  (monoton steigend, verhindert Downgrades)
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major*10000 + minor*100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Keystore bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Signierte APK bauen
        env:
          FAMILYHOME_KEYSTORE: ${{ runner.temp }}/release.keystore
          FAMILYHOME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FAMILYHOME_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          dotnet publish src/FamilyHome.Client.Android -c Release \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$CODE" -o out
          apk=$(ls out/*-Signed.apk)
          cp "$apk" "familyhome-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Update-Manifest erzeugen und signieren
        env:
          MANIFEST_KEY: ${{ secrets.UPDATE_MANIFEST_ED25519_PEM }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(sha256sum "familyhome-$VERSION.apk" | cut -d' ' -f1)
          cat > update-manifest.json <<EOF
          {"version":"$VERSION","versionCode":$CODE,"sha256":"$sha","channel":"stable",
           "url":"https://github.com/$REPO/releases/download/v$VERSION/familyhome-$VERSION.apk"}
          EOF
          echo "$MANIFEST_KEY" > "$RUNNER_TEMP/manifest.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/manifest.pem" -rawin -in update-manifest.json \
            | base64 -w0 > update-manifest.json.sig
          rm -f "$RUNNER_TEMP/manifest.pem"

      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: familyhome-${{ steps.ver.outputs.version }}.apk

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes \
            "familyhome-$VERSION.apk" update-manifest.json update-manifest.json.sig
